    <title>Industrial Lead Finder</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;

<body>

<header>
    <h1>Industrial Lead Finder</h1>
    <p>Find industrial businesses and sales prospects</p>
</header>

<div class="container">

    <div class="search-panel">

        <div class="field">
            <label for="location">ZIP Code or Location</label>

            <input
                id="location"
                type="text"
                value="17401"
                placeholder="Enter ZIP code or city">
        </div>

        <div class="field">

            <label for="radius">Search Radius</label>

            <select id="radius">
                <option value="5">5 miles</option>
                <option value="10">10 miles</option>
                <option value="25" selected>25 miles</option>
                <option value="50">50 miles</option>
                <option value="100">100 miles</option>
            </select>

        </div>

        <div class="field">

            <label>Industrial Processes</label>

            <div class="process-grid">

                <label class="process-option">
                    <input type="checkbox" value="CNC Machining">
                    CNC Machining
                </label>

                <label class="process-option">
                    <input type="checkbox" value="Machining">
                    Machining
                </label>

                <label class="process-option">
                    <input type="checkbox" value="Welding">
                    Welding
                </label>

                <label class="process-option">
                    <input type="checkbox" value="Fabrication">
                    Fabrication
                </label>

                <label class="process-option">
                    <input type="checkbox" value="Sheet Metal">
                    Sheet Metal
                </label>

                <label class="process-option">
                    <input type="checkbox" value="Laser Cutting">
                    Laser Cutting
                </label>

                <label class="process-option">
                    <input type="checkbox" value="Plasma Cutting">
                    Plasma Cutting
                </label>

                <label class="process-option">
                    <input type="checkbox" value="Waterjet">
                    Waterjet
                </label>

                <label class="process-option">
                    <input type="checkbox" value="Powder Coating">
                    Powder Coating
                </label>

                <label class="process-option">
                    <input type="checkbox" value="Industrial Painting">
                    Industrial Painting
                </label>

                <label class="process-option">
                    <input type="checkbox" value="Stamping">
                    Stamping
                </label>

                <label class="process-option">
                    <input type="checkbox" value="Grinding">
                    Grinding
                </label>

                <label class="process-option">
                    <input type="checkbox" value="Tube Bending">
                    Tube Bending
                </label>

                <label class="process-option">
                    <input type="checkbox" value="Assembly">
                    Assembly
                </label>

            </div>
        </div>

        <button class="search-btn" onclick="searchBusinesses()">
            FIND BUSINESSES
        </button>

        <button class="clear-btn" onclick="clearResults()">
            CLEAR
        </button>

    </div>

    <div class="loading" id="loading">

        <div class="spinner"></div>

        Searching for businesses...

    </div>

    <div class="results-header" id="resultsHeader"></div>

    <div class="results" id="results"></div>

</div>

<script>

async function searchBusinesses() {

    const location =
        document.getElementById("location").value.trim();

    const radiusMiles =
        Number(document.getElementById("radius").value);

    const processes =
        Array.from(
            document.querySelectorAll(
                '.process-option input:checked'
            )
        ).map(input => input.value);

    if (!location) {
        alert("Please enter a ZIP code or location.");
        return;
    }

    if (processes.length === 0) {
        alert("Please select at least one industrial process.");
        return;
    }

    document.getElementById("loading").style.display = "block";
    document.getElementById("results").innerHTML = "";
    document.getElementById("resultsHeader").innerHTML = "";

    try {

        const response = await fetch("/api/search", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                location,
                radiusMiles,
                processes
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Search failed.");
        }

        displayResults(data);

    } catch (error) {

        console.error(error);

        alert("Search failed: " + error.message);

    } finally {

        document.getElementById("loading").style.display = "none";

    }
}


function displayResults(data) {

    const results = data.leads || [];

    document.getElementById("resultsHeader").innerText =
        `${results.length} businesses found`;

    const container =
        document.getElementById("results");

    if (results.length === 0) {

        container.innerHTML =
            "<div class='business-card'>No businesses found.</div>";

        return;
    }

    results.forEach(business => {

        const card =
            document.createElement("div");

        card.className = "business-card";

        const phone =
            business.phone || "";

        const website =
            business.website || "";

        const address =
            business.address || "";

        const score =
            business.leadScore ?? business.score ?? "";

        const processes =
            business.processes || [];

        card.innerHTML = `

            <div class="business-name">
                ${escapeHtml(business.name || "Unknown Business")}
            </div>

            <div class="distance">
                ${
                    business.distanceMiles != null
                    ? business.distanceMiles.toFixed(1) + " miles away"
                    : ""
                }
            </div>

            <div class="info">
                ${escapeHtml(address)}
            </div>

            <div class="info">
                ${escapeHtml(phone)}
            </div>

            <div class="tags">

                ${
                    processes.map(process =>
                        `<span class="tag">${escapeHtml(process)}</span>`
                    ).join("")
                }

            </div>

            <div class="score">
                Lead Score: ${score}
            </div>

            <div class="actions">

                ${
                    phone
                    ? `<a class="call" href="tel:${phone}">CALL</a>`
                    : ""
                }

                ${
                    website
                    ? `<a class="website"
                         href="${escapeAttribute(website)}"
                         target="_blank">
                         WEBSITE
                       </a>`
                    : ""
                }

                <button
                    class="save"
                    onclick='saveLead(${JSON.stringify(business).replace(/'/g, "&#39;")})'>
                    SAVE
                </button>

            </div>

        `;

        container.appendChild(card);

    });
}


function saveLead(business) {

    const saved =
        JSON.parse(
            localStorage.getItem("savedLeads") || "[]"
        );

    const exists =
        saved.some(
            lead => lead.placeId === business.placeId
        );

    if (!exists) {

        saved.push(business);

        localStorage.setItem(
            "savedLeads",
            JSON.stringify(saved)
        );

        alert("Lead saved!");

    } else {

        alert("This lead is already saved.");

    }
}


function clearResults() {

    document.getElementById("results").innerHTML = "";
    document.getElementById("resultsHeader").innerHTML = "";

}


function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

    return String(value)
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

}


/* Register Service Worker */

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker
            .register("/sw.js")
            .then(() => {
                console.log(
                    "Industrial Lead Finder service worker registered."
                );
            })
            .catch(error => {
                console.error(
                    "Service worker registration failed:",
                    error
                );
            });

    });
}

</script>

</body>
</html>
